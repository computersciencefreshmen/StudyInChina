<head>
	<meta charset="utf-8">
	<title>项目管理平台</title>

	<meta http-equiv="Expires" content="0">
	<meta http-equiv="Pragma" content="no-cache">
	<meta http-equiv="Cache-control" content="no-cache">
	<meta http-equiv="Cache" content="no-cache">
	<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
	<meta name="viewport"
		content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=0">
	<link rel="stylesheet" href="layui/css/layui.css" media="all">
	<link rel="stylesheet" href="css/public.css" media="all">

	<!-- <link rel="icon" href="../src/style/images/uum_03.png" type="image/x-icon"/> -->
	<link rel="shortcut icon" href="/favicon.png" type="image/x-icon">
	<link rel="icon" href="/favicon.png" type="image/x-icon">
	<style>
		:root { --global-tip-height: 0px; }
		#globalKernelTip {
			display: none;
			position: fixed;
			top: 0;
			left: 0;
			right: 0;
			z-index: 99999;
			padding: 10px 16px;
			text-align: center;
			font-size: 14px;
			line-height: 1.5;
			color: #8a6d3b;
			background: #fcf8e3;
			border-bottom: 1px solid #faebcc;
			box-sizing: border-box;
		}
		html.browser-not-chromium #globalKernelTip { display: block; }
		#LAY_app { margin-top: 0; }
		html.browser-not-chromium body { padding-top: var(--global-tip-height); box-sizing: border-box; }
		html.browser-not-chromium .layui-layout-admin .layui-header,
		html.browser-not-chromium .layui-layout-admin .layui-logo,
		html.browser-not-chromium .layui-layout-admin .layui-side { top: var(--global-tip-height); }
		html.browser-not-chromium .layadmin-pagetabs { top: calc(50px + var(--global-tip-height)); }
		html.browser-not-chromium .layui-layout-admin .layui-body { top: calc(90px + var(--global-tip-height)); }
		html.browser-not-chromium .layadmin-tabspage-none .layui-layout-admin .layui-body { top: calc(50px + var(--global-tip-height)); }
		html.browser-not-chromium .layui-layer-adminRight { top: calc(50px + var(--global-tip-height)) !important; }
	</style>
	<script>
		(function () {
			function isChromiumBrowser() {
				var ud = navigator.userAgentData;
				if (ud && ud.brands && ud.brands.length) {
					for (var i = 0; i < ud.brands.length; i++) {
						var b = (ud.brands[i].brand || '').toLowerCase();
						if (b.indexOf('chromium') !== -1 || b.indexOf('google chrome') !== -1 || b.indexOf('microsoft edge') !== -1 || b.indexOf('opera') !== -1 || b.indexOf('brave') !== -1) {
							return true;
						}
					}
				}
				var ua = navigator.userAgent || '';
				if (/Edg\//i.test(ua) || /EdgiOS/i.test(ua)) return true;
				if (/OPR\//i.test(ua) || /Opera/i.test(ua)) return true;
				if (/CriOS\//i.test(ua)) return true;
				if (/Chrome\//i.test(ua) && /Safari/i.test(ua) && !/Firefox/i.test(ua)) return true;
				return false;
			}
			if (!isChromiumBrowser()) {
				document.documentElement.classList.add('browser-not-chromium');
			}
		})();
	</script>

</head>

<body style="overflow: auto;">
	<div id="globalKernelTip" role="alert">请使用 Chromium 内核浏览器（如 Google Chrome、Microsoft Edge 等）访问本系统，以获得最佳兼容性与使用体验。</div>
	<!-- 指定layui容器Id  -->
	<div id="LAY_app"></div>
	<script src="layui/layui.js"></script>
	<script>
		(function () {
			function syncTipHeight() {
				var tip = document.getElementById('globalKernelTip');
				if (!tip || !document.documentElement.classList.contains('browser-not-chromium')) {
					document.documentElement.style.setProperty('--global-tip-height', '0px');
					return;
				}
				document.documentElement.style.setProperty('--global-tip-height', (tip.offsetHeight || 0) + 'px');
			}
			syncTipHeight();
			window.addEventListener('resize', syncTipHeight);
		})();

				, version: '2.2.5.20261009'
				// , version: new Date().getTime()
		}).use('index');
	</script>
</body>
