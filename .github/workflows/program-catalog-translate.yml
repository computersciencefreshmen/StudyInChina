name: Translate program requirements with the MiniMax subscription

on:
  schedule:
    - cron: '8,23,38,53 * * * *'
  workflow_dispatch:
    inputs:
      review_canary:
        description: Review four pinned Chinese and English samples (at most six model calls)
        type: boolean
        default: false
      retry_failed_canary_reviews:
        description: Once only, review legacy failed pinned samples under the corrected JSON contract (manual canary only)
        type: boolean
        default: false
      max_calls:
        description: Maximum useful model calls in this checkpoint (1-240)
        type: number
        required: false
        default: 180
      concurrency:
        description: Concurrent translation requests (1-8)
        type: number
        required: false
        default: 4

permissions:
  contents: write

# Keep one translation journal owner. Augmented feed pushes use Git's
# fast-forward check and reconcile only another producer's disjoint paths.
concurrency:
  group: program-catalog-translation-${{ github.repository }}
  cancel-in-progress: false

jobs:
  translate:
    if: >-
      github.repository == 'computersciencefreshmen/StudyInChina' &&
      github.ref == 'refs/heads/main' &&
      (vars.PROGRAM_CATALOG_TRANSLATE_ENABLED == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.review_canary == true))
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.review_canary == true && 18 || 16 }}
    steps:
      - name: Check out reviewed translation code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: code
          persist-credentials: false
      - name: Check out durable program data and translation journals
        uses: actions/checkout@v6
        with:
          ref: catalog-program-feed
          path: feed
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: code/package-lock.json
      - name: Install locked dependencies without lifecycle scripts
        working-directory: code
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Translate changed text and publish validated results
        if: inputs.review_canary != true
        working-directory: code
        env:
          MINIMAX_SUBSCRIPTION_KEY: ${{ secrets.MINIMAX_SUBSCRIPTION_KEY }}
          CATALOG_MAINTENANCE_URL: ${{ vars.CATALOG_MAINTENANCE_URL }}
          CATALOG_MAINTENANCE_TOKEN: ${{ secrets.CATALOG_MAINTENANCE_TOKEN }}
          # The runner reduces each wave to the current subscription capacity.
          MAX_CALLS: ${{ inputs.max_calls || '180' }}
          MODEL_CONCURRENCY: ${{ inputs.concurrency || '4' }}
        run: >-
          node --import tsx scripts/translation/run-program-translations.mjs
          --execute --feed-dir ../feed --max-minutes 12
          --max-calls "$MAX_CALLS" --concurrency "$MODEL_CONCURRENCY"
      - name: Check semantic regressions before the bounded review
        if: github.event_name == 'workflow_dispatch' && inputs.review_canary == true
        working-directory: code
        run: node --import tsx --test scripts/translation/review-program-translations.test.mjs scripts/translation/translation-canary.test.mjs
      - name: Review four pinned program fields in Chinese and English
        if: github.event_name == 'workflow_dispatch' && inputs.review_canary == true
        working-directory: code
        env:
          CANARY_RETRY_LEGACY_FAILED: ${{ inputs.retry_failed_canary_reviews == true && 'true' || 'false' }}
          MINIMAX_SUBSCRIPTION_KEY: ${{ secrets.MINIMAX_SUBSCRIPTION_KEY }}
          CATALOG_MAINTENANCE_URL: ${{ vars.CATALOG_MAINTENANCE_URL }}
          CATALOG_MAINTENANCE_TOKEN: ${{ secrets.CATALOG_MAINTENANCE_TOKEN }}
        run: node --import tsx scripts/translation/translation-canary.mjs --execute --feed-dir ../feed
