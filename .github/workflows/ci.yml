name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, test, validate, and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test

      - name: Test full record audit
        run: npm run test:audit

      - name: Validate deadline evidence preservation and historical summaries
        run: npm run test:deadline-review

      - name: Validate content data
        run: npm run validate:data -- --directory-safe-expiry

      - name: Validate accepted directory identities and safe current-field projection
        run: npm run validate:directory -- --output "$RUNNER_TEMP/directory-integrity.json"

      # Coverage is a measured delivery objective, not proof that each school
      # currently admits students. Keep the gap visible without inventing offers.
      - name: Report current-opportunity coverage without relabeling it as complete
        run: npm run check:program-coverage -- --json "$RUNNER_TEMP/current-program-coverage.json"

      - name: Preserve directory integrity and coverage evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: directory-quality-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/directory-integrity.json
            ${{ runner.temp }}/current-program-coverage.json
          if-no-files-found: warn
          retention-days: 30

      - name: Validate D1 migrations and database integrity
        run: npm run validate:d1

      - name: Validate recursive source manifests
        run: npm run validate:manifests

      - name: Run isolated extraction and prompt-injection regressions
        run: npm run quality:synthetic-regression

      - name: Validate scheduled maintenance capacity
        run: npm run validate:maintenance

      - name: Run ingestion Worker tests
        run: npm run test:ingestion

      - name: Run Entity Materializer tests
        run: npm run test:entity-materializer

      - name: Run publisher Worker tests
        run: npm run test:publisher

      - name: Run release builder Worker tests
        run: npm run test:release-builder

      - name: Run cloud maintenance queue, quota and evidence tests
        run: npm run test:catalog-maintenance

      - name: Validate ingestion Worker bundle and bindings
        run: npm run check:worker:ingestion

      - name: Validate Entity Materializer Worker bundle and bindings
        run: npm run check:worker:entity-materializer

      - name: Validate publisher Worker bundle and bindings
        run: npm run check:worker:publisher

      - name: Validate release builder Worker bundle and bindings
        run: npm run check:worker:release-builder

      - name: Validate Catalog API Worker bundle and bindings
        run: npm run check:worker:catalog

      - name: Validate cloud maintenance Worker bundle and bindings
        run: npm run check:worker:maintenance

      - name: Build production application
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests against the production build
        run: npm run test:e2e
