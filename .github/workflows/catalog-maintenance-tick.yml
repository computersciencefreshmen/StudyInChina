name: Cloud catalog coverage diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    if: github.repository == 'computersciencefreshmen/StudyInChina' && github.actor == 'computersciencefreshmen' && github.ref == 'refs/heads/codex/coverage-diagnose-20261122'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Register the exact current production snapshot and emit sanitized diagnostics
        env:
          CATALOG_MAINTENANCE_URL: ${{ vars.CATALOG_MAINTENANCE_URL }}
          CATALOG_MAINTENANCE_TOKEN: ${{ secrets.CATALOG_MAINTENANCE_TOKEN }}
        shell: bash
        run: |
          node --import tsx --input-type=module <<'NODE'
          import { refreshPublishedCoverage } from './scripts/maintenance/refresh-published-coverage.ts'
          import { MaintenanceHttpError, maintenanceClientFromEnvironment } from './scripts/automation/catalog-maintenance-client.ts'
          try {
            const result = await refreshPublishedCoverage({
              root: process.cwd(), commit: '8f5b705895549d551c53b6b1b28c2cb93e152371',
              client: maintenanceClientFromEnvironment(process.env),
            })
            console.log(JSON.stringify(result))
          } catch (error) {
            if (!(error instanceof MaintenanceHttpError)) throw error
            console.error(JSON.stringify({ httpStatus: error.httpStatus, backendUnavailable: error.backendUnavailable, code: error.coverageCode ?? null }))
            process.exitCode = 1
          }
          NODE
