name: Cloud catalog verified model recovery
on:
  workflow_dispatch:
    inputs:
      pilot_sha:
        description: Production commit with the verified BIT pilot
        required: true
        type: string
      translation_canary:
        description: Successful independent translation calibration run
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: autonomous-catalog-maintenance-${{ github.repository }}
  cancel-in-progress: false
jobs:
  resume:
    if: github.repository == 'computersciencefreshmen/StudyInChina' && github.actor == 'computersciencefreshmen' && github.triggering_actor == 'computersciencefreshmen' && github.ref == 'refs/heads/codex/coverage-resume-20261122'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify production pilot and resume through the existing CAS control
        env:
          CATALOG_MAINTENANCE_URL: ${{ vars.CATALOG_MAINTENANCE_URL }}
          CATALOG_MAINTENANCE_TOKEN: ${{ secrets.CATALOG_MAINTENANCE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          PILOT_SHA: ${{ inputs.pilot_sha }}
          CANARY_RUN: ${{ inputs.translation_canary }}
        shell: bash
        run: |
          node --import tsx --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { maintenanceClientFromEnvironment } from './scripts/automation/catalog-maintenance-client.ts'
          const { PILOT_SHA: sha, CANARY_RUN: runId } = process.env
          assert.match(sha, /^[a-f0-9]{40}$/u)
          assert.match(runId, /^\d+$/u)
          const get = async (url, headers) => {
            const response = await fetch(url, { headers, redirect: 'error', cache: 'no-store', signal: AbortSignal.timeout(20000) })
            assert.equal(response.status, 200)
            return response.json()
          }
          const run = await get('https://api.github.com/repos/computersciencefreshmen/StudyInChina/actions/runs/' + runId,
            { Authorization: 'Bearer ' + process.env.GH_TOKEN, Accept: 'application/vnd.github+json' })
          assert.equal(run.path, '.github/workflows/program-catalog-translate.yml')
          assert.equal(run.head_branch, 'main')
          assert.equal(run.event, 'workflow_dispatch')
          assert.equal(run.conclusion, 'success')
          const proof = await get('https://raw.githubusercontent.com/computersciencefreshmen/StudyInChina/catalog-program-feed/translations/canary/' + runId + '-' + run.run_attempt + '-production.json')
          assert.equal(proof.sameRevision, true)
          assert.equal(proof.fields.length, 4)
          assert.ok(proof.fields.every(field => field.matched === true && field.expected === 'approved'))
          const client = maintenanceClientFromEnvironment(process.env)
          const site = 'https://studyinchina.vercel.app'
          const [release, sample, coverage, state] = await Promise.all([
            get(site + '/api/v1/releases/current?view=school-coverage'),
            get(site + '/api/v1/programs/bit-mechanical-engineering-bachelor-english-beijing?view=all'),
            client.json('/coverage'),
            client.json('/control'),
          ])
          assert.equal(release.data.deploymentSha, sha)
          assert.equal(sample.data.cycle.academicYear, 2027)
          assert.equal(sample.data.cycle.tuitionCny, 30000)
          assert.equal(sample.data.cycle.closesOn, '2027-06-01')
          assert.equal(coverage.sha256, release.data.coverage.sha256)
          const bit = coverage.schools.find(school => school.universityId === 'uni-beijing-institute-of-technology')
          assert.equal(bit?.currentProgramCount, 1)
          assert.equal(state.deployment.maintenanceEnabled, true)
          assert.equal(state.deployment.subscriptionConfigured, true)
          assert.equal(state.deployment.guardReady, true)
          const control = state.control
          assert.equal(control.enabled, 1)
          assert.equal(control.seed_complete, 1)
          assert.equal(control.targets_complete, 1)
          if (control.models_enabled === 0) {
            await client.json('/controls', 'POST', { expectedRevision: control.revision,
              legacyGuardSha256: control.legacy_guard_sha256, enabled: true, modelsEnabled: true })
          }
          const result = await client.json('/control')
          assert.equal(result.control.models_enabled, 1)
          assert.equal(result.control.canary_json, control.canary_json)
          console.log(JSON.stringify({ sha, canaryRun: runId, modelsEnabled: true, controlRevision: result.control.revision,
            schoolScope: coverage.schools.length, sampleCount: bit.currentProgramCount, canarySchoolCount: JSON.parse(result.control.canary_json).length }))
          NODE
